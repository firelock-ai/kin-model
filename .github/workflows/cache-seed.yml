name: Cache Seed

# An Actions cache entry is readable from the ref that wrote it and from the
# default branch, and from nowhere else. A pull request run and a merge-queue
# run cannot see each other's entries, so `refs/heads/main` is the only scope
# every build can restore from. CI used to write that scope as a side effect of
# running on push to main. That run was removed as a duplicate test pass, which
# left nothing writing it, and once the last main entry ages out at seven days
# every pull request and every queue build compiles the dependency graph cold.
#
# This workflow exists only to keep that scope alive. It is not a gate: it
# restores the source-only key `ci.yml` restores, fetches dependencies, and
# saves a cache only when the bounded epoch is missing. No build output,
# formatting, lint, or tests are cached here.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One seed per commit is pointless when several land together, and the newest
# tree is the one worth caching, so a newer push supersedes an older seed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  seed:
    name: Seed the default-branch cargo cache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both platforms `ci.yml` gates on. Each writes its own `runner.os` key,
      # so seeding one would leave the other cold.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Paths, key and restore-keys are copied verbatim from the `Check & Test`
      # job in `ci.yml`. The explicit epoch keeps one source archive per runner
      # OS instead of minting a new target archive for every dependency hash.
      - name: Restore cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Fetch dependencies
        id: fetch-dependencies
        continue-on-error: true
        run: cargo fetch

      - name: Save cargo sources on main
        if: github.ref == 'refs/heads/main' && steps.cargo-sources.outputs.cache-hit != 'true' && steps.fetch-dependencies.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
